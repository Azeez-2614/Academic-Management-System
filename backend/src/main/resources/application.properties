spring.application.name=student-manager
server.port=8080

# MySQL Database Configuration
# Default connection points to 'student_manager' with root and empty password.
# Update the password or username below to match your local MySQL configuration.
spring.datasource.url=jdbc:mysql://localhost:3306/student_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization Configuration
# Defers initialization until Hibernate creates the schema.
# Set spring.sql.init.mode=always to automatically load data.sql, or 'never' to disable.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
